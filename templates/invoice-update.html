{% extends "layout.html" %}
{% include "NavBar.html" %}
{% block body %}
<div class="max-w-5xl mx-auto bg-white shadow-lg rounded-lg p-8 mt-6">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-3">Update Invoice</h2>

  <form method="POST" class="space-y-6">
    <div>
      <label class="block font-medium text-gray-700 mb-1">Customer</label>
      <input type="text" id="customer" value="{{ invoice.customer.username }}" 
             class="w-full p-2 border border-gray-300 rounded focus:ring focus:ring-blue-300" autocomplete="off" />
      <input type="hidden" name="customer" id="customer_id" value="{{ invoice.customer.id }}">
      <div id="suggestions" class="border  border-gray-300 bg-white absolute z-10 w-1/3 rounded shadow"></div>
    </div>

    <div>
      <label class="block font-medium text-gray-700 mb-1">Invoice Date</label>
      <input type="date" name="invoice_date" value="{{ invoice.invoice_date }}" 
             class="w-full p-2 border  border-gray-300 rounded bg-gray-50">
    </div>

    <div>
      <label class="block font-medium text-gray-700 mb-1">Total Amount</label>
      <input type="text" id="totalAmount" name="total_amount" 
             value="{{ invoice.total_amount }}" readonly 
             class="w-full p-2 border  border-gray-300 rounded bg-gray-100 font-semibold text-right">
    </div>

    <div>
      <h3 class="text-lg font-semibold text-gray-800 mb-3">Items</h3>
      <div class="overflow-x-auto">
        <table class="w-full border-collapse border border-gray-300 text-sm">
          <thead class="bg-gray-100 text-gray-700 uppercase">
            <tr>
              <th class="border  border-gray-300 px-3 py-2">Item Name</th>
              <th class="border  border-gray-300 px-3 py-2">Quantity</th>
              <th class="border  border-gray-300 px-3 py-2">Unit Price</th>
              <th class="border  border-gray-300 px-3 py-2">Amount</th>
              <th class="border  border-gray-300 px-3 py-2">Actions</th>
            </tr>
          </thead>
          <tbody id="items">
            {% for item in items %}
            <tr class="item-row">
              <td class="border px-3 py-2">
                <input type="hidden" name="item_id[]" value="{{ item.id }}">
                <input type="text" name="item_name[]" value="{{ item.item_name }}" 
                       class="w-full p-2 border  border-gray-300 rounded">
              </td>
              <td class="border px-3 py-2">
                <input type="number" name="qty[]" value="{{ item.quantity }}" 
                       class="w-full p-2 border  border-gray-300 rounded qty-input">
              </td>
              <td class="border px-3 py-2">
                <input type="text" name="price[]" value="{{ item.unit_price }}" 
                       class="w-full p-2 border  border-gray-300 rounded price-input">
              </td>
              <td class="border px-3 py-2 text-right font-medium amount-cell">
                {{ item.quantity * item.unit_price }}
              </td>
              <td class="border px-3 py-2 text-center">
                <button type="button" 
                        class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600"
                        onclick="this.closest('tr').remove(); recalcTotal();">
                  Remove
                </button>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>

      <div class="mt-4">
        <button type="button" id="add-item" 
                class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg shadow">
          + Add Item
        </button>
      </div>
    </div>

    <div class="text-right">
      <button type="submit" 
              class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg shadow">
        Update Invoice
      </button>
    </div>
  </form>
</div>

<script src="{{ url_for('static', filename='autocomp.js') }}"></script>
<script>
  alert("{{ alert }}");

  function recalcTotal() {
    let total = 0;
    document.querySelectorAll("#items tr").forEach(row => {
      const qty = parseFloat(row.querySelector(".qty-input")?.value) || 0;
      const price = parseFloat(row.querySelector(".price-input")?.value) || 0;
      const amount = qty * price;
      row.querySelector(".amount-cell").textContent = amount.toFixed(2);
      total += amount;
    });
    document.getElementById("totalAmount").value = total.toFixed(2);
  }

  document.getElementById("add-item").addEventListener("click", function() {
    const tbody = document.getElementById("items");
    const row = document.createElement("tr");
    row.className = "item-row";
    row.innerHTML = `
      <td class="border border-gray-300 px-3 py-2">
        <input type="text" name="item_name[]" placeholder="Item name" class="w-full p-2 border border-gray-300 rounded">
      </td>
      <td class="border border-gray-300 px-3 py-2">
        <input type="number" name="qty[]" placeholder="Qty" class="w-full p-2 border border-gray-300 rounded qty-input">
      </td>
      <td class="border border-gray-300 px-3 py-2">
        <input type="text" name="price[]" placeholder="Unit Price" class="w-full p-2 border border-gray-300 rounded price-input">
      </td>
      <td class="border border-gray-300 px-3 py-2 text-right font-medium amount-cell">0.00</td>
      <td class="border border-gray-300 px-3 py-2 text-center">
        <button type="button" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600"
                onclick="this.closest('tr').remove(); recalcTotal();">Remove</button>
      </td>
    `;
    tbody.appendChild(row);
  });

  document.addEventListener("input", function(e) {
    if (e.target.classList.contains("qty-input") || e.target.classList.contains("price-input")) {
      recalcTotal();
    }
  });
</script>
{% endblock %}
