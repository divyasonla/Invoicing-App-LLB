{% extends "layout.html" %}
   {% include "NavBar.html" %}
{% block title %} customer {% endblock %}

{% block body %}
<div class="flex items-center justify-center min-h-screen bg-amber-100">
<div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md">
   <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Customer Create</h1>
   <form  action="/customer" method="post">
      <div class="text-left">
         <label class="block text-gray-700 font-medium mb-1">Username</label>

         <input 
          class="w-full border-2 border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
         type="text" name="username" placeholder="UserName" required>
      </div>
      <div class="text-left">
         <label class="block text-gray-700 font-medium mb-1">Email</label>
      
         <input 
          class="w-full border-2 border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
          type="text" name="email" placeholder="Email" required>

      </div>
      <div class="text-left">
         <label class="block text-gray-700 font-medium mb-1">Address</label>

         <textarea
          class="w-full border-2 border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
         type="text" name="address" placeholder="Address" required>
         </textarea>
      </div>
    <button 
        class="w-full bg-blue-500 text-white font-semibold py-2 rounded-lg shadow-md hover:bg-blue-600 transition"
       type="submit">
       submit
      </button>
   
   </form>
</div>
</div>
{% endblock %}
