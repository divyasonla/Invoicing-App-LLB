{% extends "layout.html" %}

{% block body %}
<nav class="relative flex flex-wrap items-center justify-between bg-white/90 backdrop-blur-sm shadow-md px-6 py-4 rounded-2xl border border-gray-100">
    <div class="flex items-center space-x-3">
        <h1 class="font-semibold text-lg text-gray-800 tracking-tight">Invoice Manager</h1>
    </div>

    <div class=" md:flex items-center space-x-6">
        <a href="/" class="bg-indigo-50  font-medium px-3 py-2 rounded-lg ">Dashboard</a>
        <a href="/invoice" class="text-gray-700 font-medium px-3 py-2 rounded-lg ">Invoices</a>
        <a href="/customer" class="text-gray-700 font-medium px-3 py-2 rounded-lg ">Customers</a>
    </div>

    <div class="flex items-center space-x-3">
        <a href="/logout" class="border border-gray-300 px-4 py-2 rounded-lg text-gray-700 font-medium hover:bg-red-100">Logout</a>
        <button id="menu-btn" class="md:hidden text-gray-600 ">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </div>

    <div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-white shadow-lg rounded-b-2xl border-t border-gray-100 md:hidden">
        <a href="/" class="block px-6 py-3 text-gray-700 ">Dashboard</a>
        <a href="/invoice" class="block px-6 py-3 text-gray-700 ">Invoices</a>
        <a href="/customer" class="block px-6 py-3 text-gray-700 ">Customers</a>
    </div>
</nav>

<script>
document.getElementById('menu-btn').addEventListener('click', () => {
    const menu = document.getElementById('mobile-menu');
    menu.classList.toggle('hidden');
});
</script>
{% endblock %}
